map $http_cf_connecting_ip $squitv_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $squitv_client_ip zone=squitv_iptv_link:1m rate=12r/m;
limit_req_zone $squitv_client_ip zone=squitv_iptv_read:1m rate=60r/m;
limit_req_zone $squitv_client_ip zone=squitv_account_sync:1m rate=180r/m;

server {
    listen 127.0.0.1:443 ssl;
    listen 192.168.2.247:443 ssl;
    server_name squitv.rafael020703.shop;
    allow 127.0.0.1;
    allow 192.168.2.250;
    deny all;
    ssl_certificate /etc/squitv-account/portal-cert.pem;
    ssl_certificate_key /etc/squitv-account/portal-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/squitv-account;
    index index.html;
    access_log off;
    add_header Referrer-Policy "no-referrer" always;

    location ~ ^/api/iptv/(details|categories)$ {
        limit_req zone=squitv_iptv_read burst=8 nodelay;
        limit_req_status 429;
        proxy_connect_timeout 2s;
        proxy_read_timeout 14s;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/api/iptv/(link|credentials|native-login|reveal|select)$ {
        limit_req zone=squitv_iptv_link burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_connect_timeout 2s;
        proxy_read_timeout 14s;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/api/sync/(account|profiles|favorites|categories|progress|catalog)$ {
        limit_req zone=squitv_account_sync burst=25 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_connect_timeout 2s;
        proxy_read_timeout 14s;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Authorization $http_authorization;
    }

    location = /auth/realms/squitv/account/ {
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /auth/realms/squitv/account {
        return 308 /auth/realms/squitv/account/;
    }

    location ^~ /auth/realms/squitv/account/ {
        return 404;
    }

    location ~ ^/auth/(realms/squitv(?:/|$)|resources/) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host squitv.rafael020703.shop;
        proxy_set_header X-Forwarded-Host squitv.rafael020703.shop;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /auth/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
