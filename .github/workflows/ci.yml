name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Project Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'

      - name: Run Shared Module Tests
        run: ./gradlew :shared:test --console=plain

      - name: Test Release Manifest Generator
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Run Android Unit Tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Compile Release Kotlin
        run: ./gradlew :app:compileReleaseKotlin --console=plain

      - name: Run Lint
        run: ./gradlew :app:lintDebug --console=plain
