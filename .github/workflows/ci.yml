name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Project Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'

      - name: Run Shared Module Tests
        run: ./gradlew :shared:test --console=plain

      - name: Test Release Manifest Generator
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Run Android Unit Tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Compile Release Kotlin
        run: ./gradlew :app:compileReleaseKotlin --console=plain

      - name: Run Lint
        run: ./gradlew :app:lintDebug --console=plain

  windows:
    name: Windows variants
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Ensure Project Android SDK
        shell: pwsh
        run: '& "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Package Windows release (never execute it)
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageExe --console=plain
      - name: Test and package Windows debug online installer
        shell: pwsh
        run: .\gradlew.bat :shared:test :desktopApp:test :desktopApp:packageExe '-PdesktopVariant=debug' '-PdesktopInstaller=online' --console=plain
      - name: Verify components with debug resources only (no MSI executed)
        shell: pwsh
        run: .\tools\verify-windows-installer.ps1
